name: Playwright Tests - Different Repos
on:
    # Trigger when application is deployed
    repository_dispatch:
        types: [deployment-completed]

    # Manual trigger
    workflow_dispatch:
        inputs:
            app_branch:
                description: 'Application branch to deploy'
                required: true
                default: 'main'
            test_branch:
                description: 'Test branch to use'
                required: true
                default: 'main'
            environment:
                description: 'Environment to test'
                required: true
                default: 'dev'
                type: choice
                options:
                    - dev
                    - staging
                    - prod

    # Schedule regular test runs
    # schedule:
    #   - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
    setup-and-test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
                shard: [1, 2, 3, 4]

        steps:
            # Checkout the APPLICATION repository
            - name: Checkout Application Repository
              uses: actions/checkout@v4
              with:
                  repository: ${{ secrets.APP_REPO_OWNER }}/${{ secrets.APP_REPO_NAME }}
                  token: ${{ secrets.GH_PAT_TOKEN }}
                  ref: ${{ github.event.inputs.app_branch || 'main' }}
                  path: ./application

            # Checkout the TEST repository (current repo)
            - name: Checkout Test Repository
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.repository }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.event.inputs.test_branch || 'main' }}
                  path: ./tests

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: ./tests/package-lock.json

            # Install and build application (if needed)
            - name: Install Application Dependencies
              working-directory: ./application
              run: |
                  if [ -f package.json ]; then
                    npm ci
                  fi

            - name: Build Application
              working-directory: ./application
              env:
                  NODE_ENV: production
                  API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: |
                  if [ -f package.json ] && grep -q "\"build\"" package.json; then
                    npm run build
                  fi

            # Start application server in background
            - name: Start Application Server
              working-directory: ./application
              env:
                  PORT: 3000
                  NODE_ENV: ${{ github.event.inputs.environment || 'dev' }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  REDIS_URL: ${{ secrets.REDIS_URL }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
              run: |
                  if [ -f package.json ] && grep -q "\"start\"" package.json; then
                    npm start &
                    # Wait for server to be ready
                    timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'
                  fi

            # Setup and run tests
            - name: Install Test Dependencies
              working-directory: ./tests
              run: npm ci

            - name: Install Playwright Browsers
              working-directory: ./tests
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Run Playwright Tests
              working-directory: ./tests
              env:
                  # Application URLs
                  BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
                  API_URL: ${{ secrets.API_URL }}

                  # Authentication
                  TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
                  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
                  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

                  # API credentials
                  API_KEY: ${{ secrets.API_KEY }}
                  API_SECRET: ${{ secrets.API_SECRET }}
                  AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

                  # Database (if tests need direct DB access)
                  DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

                  # Environment configuration
                  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
                  CI: true
                  PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

                  # Test sharding
                  SHARD: ${{ matrix.shard }}/4

                  # Additional settings
                  HEADLESS: true
                  TIMEOUT: 30000
              run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
                  path: ./tests/playwright-report/
                  retention-days: 30

            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}
                  path: ./tests/test-results/
                  retention-days: 30

            - name: Upload Traces on Failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: traces-${{ matrix.browser }}-shard-${{ matrix.shard }}
                  path: ./tests/playwright-report/trace/
                  retention-days: 30

            - name: Stop Application Server
              if: always()
              run: |
                  pkill -f "node.*start" || true

    merge-reports:
        needs: setup-and-test
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Checkout Test Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Download all reports
              uses: actions/download-artifact@v4
              with:
                  path: all-reports
                  pattern: playwright-report-*

            - name: Merge reports
              run: npx playwright merge-reports --reporter html ./all-reports

            - name: Upload merged report
              uses: actions/upload-artifact@v4
              with:
                  name: merged-playwright-report
                  path: playwright-report/
                  retention-days: 30

    notify:
        needs: [setup-and-test, merge-reports]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Send Slack Notification
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                  STATUS: ${{ needs.setup-and-test.result }}
                  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
              run: |
                  if [ -n "$SLACK_WEBHOOK" ]; then
                    curl -X POST $SLACK_WEBHOOK \
                    -H 'Content-Type: application/json' \
                    -d "{
                      \"text\":\"Playwright E2E Tests - $ENVIRONMENT\",
                      \"attachments\":[{
                        \"color\":\"$(if [ \"$STATUS\" = \"success\" ]; then echo \"good\"; else echo \"danger\"; fi)\",
                        \"text\":\"Status: $STATUS\nEnvironment: $ENVIRONMENT\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                      }]
                    }"
                  fi

            - name: Send Email Notification
              if: failure()
              env:
                  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
                  EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL }}
              run: |
                  if [ -n "$SENDGRID_API_KEY" ]; then
                    echo "Send email notification here using SendGrid or similar service"
                  fi
